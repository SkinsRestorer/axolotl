[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
