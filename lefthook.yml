min_version: 1.13.6

pre-commit:
  commands:
    whitespace:
      run: git diff --cached --check
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
      files: git diff --cached --name-only --diff-filter=ACMR

commit-msg:
  commands:
    conventional-commits:
      run: |
        subject=$(head -n 1 "{1}") || exit 1
        case "$subject" in
          "Merge "*|'Revert "'*|"fixup! "*|"squash! "*|"amend! "*) exit 0 ;;
        esac
        if ! printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([^()[:space:]]+\))?!?: [^[:space:]]'; then
          printf '%s\n' 'Use a Conventional Commit subject, for example: fix(parser): handle empty input.' >&2
          exit 1
        fi

pre-push:
  commands:
    clippy:
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
      # Without an upstream, such as on the first push of a branch, compare with
      # origin/main. Without origin/main, check every tracked file.
      files: &pushed_files |
        base=$(git rev-parse --verify --quiet '@{upstream}' || git merge-base HEAD origin/main 2>/dev/null) || base=
        if [ -n "$base" ]; then git diff --name-only "$base" HEAD; else git ls-files; fi
      glob: "{*.rs,Cargo.toml,Cargo.lock,rust-toolchain.toml,clippy.toml}"
    cargo-deny:
      run: cargo deny --locked check
      files: *pushed_files
      glob: "{Cargo.toml,Cargo.lock,deny.toml}"
