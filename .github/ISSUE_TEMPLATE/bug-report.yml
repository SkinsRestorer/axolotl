name: Bug report
description: Report a reproducible problem.
body:
- type: markdown
  attributes:
    value: This form is for the Axolotl API service. Report SkinsRestorer plugin problems in
      [the SkinsRestorer repository](https://github.com/SkinsRestorer/SkinsRestorer/issues).
      For setup questions, read [the support guide](https://github.com/SkinsRestorer/axolotl/blob/main/SUPPORT.md).
      Remove secrets and private data from reports. Report vulnerabilities privately as described in
      [the security policy](https://github.com/SkinsRestorer/axolotl/blob/main/SECURITY.md).
- type: checkboxes
  id: prior-search
  attributes:
    label: Before submitting
    options:
    - label: I searched existing issues and the relevant documentation.
      required: true
- type: textarea
  id: problem
  attributes:
    label: What happened?
    description: Describe the observed problem and its effect.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
    description: Give the smallest reproducible example. Use synthetic data.
    placeholder: '1. Send POST /mineskin/skins with ...

      2. Observe ...'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: Describe the result you expected.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Version and deployment
    description: The Axolotl commit or image tag, and the deployment (hosted service, Docker image, or
      a platform that builds the Dockerfile). Include the method, path, response status, and JSON error body.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Logs or configuration
    description: Include only relevant excerpts. Remove API keys, AES_SECRET_KEY, webhook URLs, personal
      data, and private host details.
    render: text
