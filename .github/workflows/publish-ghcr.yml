name: Publish GHCR Image

# Publish only after the "Build and test" workflow (build.yml) passes for a
# push to main. A workflow_run trigger avoids duplicating the test job here.
on:
  # Safe here: the jobs below run only for push events from this repository,
  # never for pull requests from forks.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Build and test
    types:
      - completed
    branches:
      - main

permissions: {}

# Never cancel a running publish. A cancelled run could stop after the tags
# moved but before Dokploy was told to deploy. GitHub keeps only the newest
# pending run, so a burst of pushes publishes the first and the last commit.
concurrency:
  group: publish-ghcr
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # workflow_run sets GITHUB_SHA to the latest default branch commit, so use
  # the commit that CI actually tested.
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare image tag
        env:
          ARCH: ${{ matrix.arch }}
        run: echo "IMAGE_TAG=${REGISTRY}/${GITHUB_REPOSITORY,,}:sha-${HEAD_SHA::12}-${ARCH}" >> "$GITHUB_ENV"

      # The GIT_SHA build argument bakes the commit into the binary for the startup log.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: GIT_SHA=${{ env.HEAD_SHA }}

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          sha_tag="${image}:sha-${HEAD_SHA::12}"

          docker buildx imagetools create \
            --tag "$sha_tag" \
            --tag "${image}:main" \
            --tag "${image}:latest" \
            "${sha_tag}-amd64" \
            "${sha_tag}-arm64"

          docker buildx imagetools inspect "$sha_tag"

      - name: Deploy to Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          : "${DOKPLOY_WEBHOOK_URL:?Set the DOKPLOY_WEBHOOK_URL repository secret}"

          status=$(curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 \
            --write-out '%{http_code}' \
            --request POST "$DOKPLOY_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data '{}')

          case "$status" in
            2??) echo "Dokploy deployment requested." ;;
            *) echo "::error::Dokploy webhook returned HTTP $status"; exit 1 ;;
          esac
