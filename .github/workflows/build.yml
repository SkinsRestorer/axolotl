name: Build and test

on:
  # Other branches are checked through their pull request, so same-repo PRs
  # don't run twice. Renovate automerges non-major branches without a PR, so
  # those branches keep a push trigger. Major updates always get a PR, and
  # renovate.json puts them under renovate/major/.
  push:
    branches:
      - main
      - "renovate/**"
      - "!renovate/major/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rustup reads the version and components from rust-toolchain.toml,
      # which Renovate updates.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked
