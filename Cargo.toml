[package]
name = "axolotl"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "MineSkin proxy service for SkinsRestorer"
license = "GPL-3.0-only"
repository = "https://github.com/SkinsRestorer/axolotl"

[dependencies]
aes = "0.9.1"
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc"] }
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.0"
cbc = "0.2.1"
dotenvy = "0.15.7"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", features = ["std"] }
jiff = { version = "1.0.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "10.0.0", default-features = false, features = ["axum", "vendored"] }
uuid = "1.24.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
redundant_clone = "warn"

# Safety and correctness
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
string_slice = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
exit = "warn"
rc_buffer = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
try_err = "warn"
rest_pat_in_fully_bound_structs = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "warn"
significant_drop_tightening = "warn"
# Better test failures
assertions_on_result_states = "warn"
missing_assert_message = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
